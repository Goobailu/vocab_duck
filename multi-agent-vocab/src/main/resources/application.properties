server.port=${PORT:8080}

# 本地真实配置放在项目根目录的 application-local.properties（已被 .gitignore 忽略），
# 线上通过部署平台的环境变量注入，禁止把密钥写进本文件。
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/words?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.default-property-inclusion=non_null

jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

llm.api-key=${LLM_API_KEY:}
llm.api-base=${LLM_API_BASE:https://api.deepseek.com/v11}
llm.model=${LLM_MODEL:deepseek-chat}
llm.timeout=90

image.api-key=${IMAGE_API_KEY:}
image.api-base=${IMAGE_API_BASE:https://image.pollinations.ai}
image.model=${IMAGE_MODEL:flux}

sr.initial-ef=2.5
sr.min-ef=1.3
sr.first-interval=1
sr.second-interval=6

learning.daily-new-words-default=20
learning.max-daily-new-words=50

# 允许跨域的前端域名，逗号分隔；生产环境设为前端实际域名
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
